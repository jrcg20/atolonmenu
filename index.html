  <style>
    :root {
      --blue: #00186b;
      --lilac: #b84fc1;
      --pale-lilac: #f8e8fa;
      --line: #cad1e8;
      --soft-blue: #f4f7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--blue);
      font-family: "DM Sans", sans-serif;
    }

    .menu-shell {
      width: 100%;
      min-height: 100%;
      overflow: hidden;
    }

    .hero-band {
      background: linear-gradient(135deg, #ffffff 0%, #f8f4ff 58%, #f2f6ff 100%);
      border-bottom: 1px solid var(--line);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.05rem 4.5rem;
    }

    .title-heavy {
      color: var(--lilac);
      font-family: Arial, "DM Sans", sans-serif;
      font-weight: 800;
      letter-spacing: -.035em;
      line-height: 1.08;
    }

    .category-nav {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .97);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .category-scroll {
      display: flex;
      gap: .55rem;
      overflow-x: auto;
      padding: .75rem 0;
      scrollbar-width: thin;
      scrollbar-color: #b9c2df transparent;
    }

    .category-scroll::-webkit-scrollbar { height: 5px; }
    .category-scroll::-webkit-scrollbar-thumb {
      background: #b9c2df;
      border-radius: 99px;
    }

    .category-btn {
      flex: 0 0 auto;
      min-height: 2.65rem;
      border: 1.5px solid var(--blue);
      border-radius: .75rem;
      background: #ffffff;
      color: var(--blue);
      padding: .6rem .9rem;
      font-size: .71rem;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: .035em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .category-btn:hover {
      background: var(--pale-lilac);
      transform: translateY(-1px);
    }

    .category-btn:focus-visible {
      outline: 3px solid #e9a5ed;
      outline-offset: 3px;
    }

    .category-btn.is-active {
      background: var(--blue) !important;
      color: #ffffff !important;
      border-color: var(--blue) !important;
      box-shadow: 0 7px 15px rgba(0, 24, 107, .17);
    }

    .panel[hidden] { display: none; }
    .menu-panel { animation: rise .28s ease both; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-card {
      background: linear-gradient(135deg, #fff8ff, #f2f6ff);
      border: 1px solid #ddb8e1;
    }

    .rule {
      width: min(145px, 38%);
      height: 2px;
      margin-top: .85rem;
      margin-bottom: 1.25rem;
      border-radius: 99px;
      background: var(--lilac);
    }

    .subsection-title {
      margin: 1.75rem 0 .35rem;
      color: var(--blue);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .subsection-title:first-child { margin-top: 0; }

    .subsection-rule {
      width: 100%;
      height: 1px;
      margin-bottom: .2rem;
      background: #d9c2e1;
    }

    .menu-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      padding: .9rem 0;
      border-bottom: 1px solid var(--line);
    }

    .menu-row.priced {
      grid-template-columns: minmax(0, 1fr) minmax(95px, .42fr) minmax(105px, .48fr);
    }

    .drink-name {
      color: var(--blue);
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.28;
    }

    .drink-desc {
      margin: .38rem 0 0;
      color: #294483;
      font-size: .91rem;
      line-height: 1.48;
      max-width: 58rem;
    }

    .price {
      align-self: start;
      color: var(--blue);
      font-size: .92rem;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
    }

    .price-head {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: .35rem;
      color: #3c5691;
      font-size: .66rem;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: .05em;
      text-align: right;
      text-transform: uppercase;
    }

    .price-head svg {
      width: .92rem;
      height: .92rem;
      stroke-width: 2.2;
    }

    .menu-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 7rem;
      margin-top: 1.5rem;
      padding: 1.5rem 4.5rem 2rem;
      border-top: .5px solid var(--line);
      background: linear-gradient(180deg, rgba(248, 232, 250, .28), rgba(244, 247, 255, .74));
    }

    .fish-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: min(10rem, 44vw);
      height: 3.2rem;
      overflow: visible;
    }

    .fish-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      transform: scale(1.15);
      mix-blend-mode: multiply;
    }

    @media (max-width: 640px) {
      .logo-wrap { padding: 1.15rem 4rem; }

      .category-scroll {
        padding: .62rem 0;
        gap: .45rem;
      }

      .category-btn {
        min-height: 2.48rem;
        padding: .55rem .76rem;
        font-size: .67rem;
      }

      .menu-row {
        gap: .7rem;
        padding: .82rem 0;
      }

      .menu-row.priced {
        grid-template-columns: minmax(0, 1fr) minmax(72px, .3fr) minmax(78px, .34fr);
        gap: .85rem;
        padding: 1.05rem 0;
        align-items: start;
      }

      .menu-row.priced .drink-meta,
      .menu-row.priced .bottle-price,
      .price-head.glass-head,
      .price-head.bottle-head {
        grid-row: auto;
        grid-column: auto;
      }

      .price-head {
        gap: .2rem;
        font-size: .57rem;
        line-height: 1.2;
      }

      .price-head svg {
        width: .75rem;
        height: .75rem;
      }

      .price {
        font-size: .72rem;
        line-height: 1.3;
        white-space: normal;
        overflow-wrap: anywhere;
      }

      .drink-name { font-size: .96rem; }
      .drink-desc { font-size: .8rem; }
    }
  </style>

      "whisky-panel",
      "aguardiente-panel",
      "spirits-panel",
      "tequila-panel",
      "rum-panel",
      "vodka-gin-panel"
    ]);

    function createHeaderRow(panelId, martiniOnly = false) {
      const usesShot = shotPanels.has(panelId);
      const isMartini = martiniOnly;
      const isSparkling = panelId === "sparkling-panel";
      const row = document.createElement("div");
      row.className = "menu-row priced";
      row.innerHTML = `
        <div></div>
        <div class="price-head glass-head">
          ${isMartini ? "" : `<i data-lucide="${usesShot ? "glass-water" : "wine"}" aria-hidden="true"></i>`}
          <span>${isSparkling || isMartini ? "" : (usesShot ? "Por shot | By shot" : "Por copeo | By glass")}</span>
        </div>
        <div class="price-head bottle-head">
          <i data-lucide="milk" aria-hidden="true"></i>
          <span>${isMartini ? "" : "Por botella | By bottle"}</span>
        </div>
      `;
      return row;
    }

    function createRow(item, panelId = "") {
      const [name, description, servicePrice, bottlePrice] = item;
      const isMartini = panelId === "spirits-panel" && !bottlePrice && ["Martini Rosso", "Martini Dry", "Martini Bianco"].includes(name);
      const row = document.createElement("div");
      row.className = bottlePrice || isMartini ? "menu-row priced" : "menu-row";

      row.innerHTML = `
        <div class="${bottlePrice || isMartini ? "drink-meta" : ""}">
          <div class="drink-name"></div>
          ${description ? '<p class="drink-desc"></p>' : ""}
        </div>
        <div class="price"></div>
        ${bottlePrice || isMartini ? '<div class="price bottle-price"></div>' : ""}
      `;

      row.querySelector(".drink-name").textContent = name;
      if (description) row.querySelector(".drink-desc").innerHTML = description.replace(". ", ".<br>");
      row.querySelector(".price").textContent = servicePrice;
      if (bottlePrice) row.querySelector(".bottle-price").textContent = bottlePrice;
      return row;
    }

    function addItems(list, panelId, items) {
      const usesBottlePrices = items.some(item => item[3]);
      const isSparkling = panelId === "sparkling-panel";
      if (usesBottlePrices || isSparkling) list.appendChild(createHeaderRow(panelId));
      items.forEach(item => list.appendChild(createRow(item, panelId)));
    }

    Object.entries(menuData).forEach(([panelId, content]) => {
      const list = document.querySelector(`#${panelId} .menu-list`);

      if (content.groups) {
        content.groups.forEach(group => {
          const groupTitle = document.createElement("h3");
          groupTitle.className = "subsection-title";
          groupTitle.textContent = group.title;

          const groupRule = document.createElement("div");
          groupRule.className = "subsection-rule";

          list.appendChild(groupTitle);
          list.appendChild(groupRule);
          addItems(list, panelId, group.items);
        });
        if (content.items) addItems(list, panelId, content.items);
      } else if (Array.isArray(content)) {
        addItems(list, panelId, content);
      } else {
        addItems(list, panelId, content.items);
        if (content.note) {
          const note = document.createElement("p");
          note.className = "drink-desc mt-4 font-semibold text-base sm:text-lg";
          note.innerHTML = "La cerveza <strong>Michelada</strong> tiene un costo adicional de <strong>$3.000</strong> y con <strong>Clamato</strong> un costo adicional de <strong>$10.000</strong>.";
          list.appendChild(note);
        }
      }
    });

    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        const targetId = tab.dataset.panel;

        tabs.forEach((item) => {
          const selected = item === tab;
          item.classList.toggle("is-active", selected);
          item.setAttribute("aria-selected", String(selected));
        });

        panels.forEach((panel) => {
          const selected = panel.id === targetId;
          panel.hidden = !selected;

          if (selected) {
            panel.classList.remove("menu-panel");
            void panel.offsetWidth;
            panel.classList.add("menu-panel");
          }
        });
      });
    });

    lucide.createIcons();
